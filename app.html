<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kauncher</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kauncher">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#E4E0EE;--ink:#201A33;--mute:#6B6483;--accent:#4A35FF;--surface:#F3F1F8;--line:#C9C3DB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16122A;--ink:#EDEAF8;--mute:#9189B0;--accent:#9C8CFF;--surface:#221C3D;--line:#342D55}}
:root[data-theme="dark"]{--bg:#16122A;--ink:#EDEAF8;--mute:#9189B0;--accent:#9C8CFF;--surface:#221C3D;--line:#342D55}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.screen{height:100%;display:flex;flex-direction:column;padding:28px 26px 18px;max-width:520px;margin:0 auto}
.screen{overflow-y:auto}.screen>*{flex-shrink:0}
@media (orientation:landscape) and (max-height:520px){.time{font-size:40px}.mid{justify-content:flex-start;gap:14px;padding:12px 0}.running .time{font-size:28px}}
.time{font-family:'Bricolage Grotesque',sans-serif;font-weight:300;font-size:64px;letter-spacing:-.03em;line-height:1;transition:font-size .5s}
.date{color:var(--mute);margin-top:8px;font-size:15px}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}
.focus{width:100%;background:none;border:0;border-bottom:1.5px solid var(--line);padding:6px 0 14px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(30px,9vw,44px);letter-spacing:-.02em;line-height:1.1;color:var(--ink);transition:border-color .3s}
.focus::placeholder{color:var(--mute);opacity:.55}
.focus:focus{border-color:var(--accent);outline:none}
.timer{align-self:flex-start;display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.timer i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:block}
.running .timer i{animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{transform:scale(.5);opacity:.5}}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;transition:opacity .6s}
.tool{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;font-size:13px;color:var(--mute)}
.tool svg{width:44px;height:44px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;padding:10px;border-radius:50%;border:1.5px solid var(--line);transition:.2s}
.tool:active svg{background:var(--accent);stroke:var(--bg);border-color:var(--accent)}
.handle{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 6px;color:var(--mute);font-size:13px;touch-action:none}
.handle b{width:36px;height:4px;border-radius:2px;background:var(--line)}
.running .tool:not([data-app="Phone"]),.running .handle{opacity:.12;pointer-events:none}
.running .time{font-size:30px}
.drawer{position:fixed;inset:0;background:var(--surface);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 20px) 26px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5}
.drawer.open{transform:none}
.dhead{display:flex;gap:14px;align-items:center;max-width:520px;width:100%;margin:0 auto 10px}
.search{flex:1;background:none;border:0;border-bottom:1.5px solid var(--line);padding:10px 0;font:inherit;font-size:20px;color:var(--ink)}
.search:focus{outline:none;border-color:var(--accent)}
.close{color:var(--mute);padding:8px}
.list{flex:1;overflow-y:auto;max-width:520px;width:100%;margin:0 auto}
.list h2{font-weight:400;font-size:14px;color:var(--mute);margin:22px 0 4px}
.app{display:block;width:100%;text-align:left;padding:9px 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:300;font-size:32px;letter-spacing:-.02em}
.app:active{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.focus,.search{-webkit-user-select:text;user-select:text}
.bgimg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:-1;display:none}
.bgimg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
body.photo{--ink:#F5F3FA;--mute:#C9C3DB;--line:rgba(255,255,255,.35);--bg:#16122A;--surface:#221C3D}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:8}
.menu.open{display:flex}
.sheet{background:var(--surface);border-radius:24px;padding:24px;width:min(86vw,340px)}
.sheet h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:20px;margin-bottom:6px}
.sheet .row{display:block;width:100%;text-align:left;padding:10px 0;font-size:18px}
.sheet .row.m{color:var(--mute);font-size:15px}
.sw{display:flex;gap:12px;margin:10px 0}
.sw button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line)}
.note2{color:var(--mute);font-size:13px;margin-top:8px}
.focus.sm{font-size:clamp(20px,6vw,24px);padding-bottom:10px}
.hint{color:var(--mute);font-size:13px;margin-top:-12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="screen" id="screen">
  <header>
    <div class="time" id="time">9:41</div>
    <div class="date" id="date"></div>
  </header>
  <section class="mid">
    <input class="focus" id="focus" placeholder="What are you learning today?" maxlength="60" enterkeyhint="search" aria-label="Today’s focus" autocomplete="off">
    <input class="focus sm" id="creating" placeholder="What are you creating?" maxlength="40" enterkeyhint="done" aria-label="What are you creating" autocomplete="off">
    <p class="hint">Starts after you type what you are creating. Creative: 30 min. Anything else: 1 hour, locked.</p>
    <button class="timer" id="timer" aria-label="Start or stop a focus session"><i></i><span id="tlabel">Focus 25:00</span></button>
  </section>
  <nav class="tools" id="tools">
    <button class="tool" data-app="Notes"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg>Krite</button>
    <button class="tool" data-app="Notes"><svg viewBox="0 0 24 24"><path d="M4 16c4-10 8 4 10-4s4-2 6-4"/></svg>Ketch</button>
    <button class="tool" data-app="Voice Memos"><svg viewBox="0 0 24 24"><rect x="9" y="4" width="6" height="11" rx="3"/><path d="M6 12a6 6 0 0012 0M12 18v3"/></svg>Kord</button>
    <button class="tool" data-app="Camera"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><circle cx="12" cy="13" r="3"/></svg>Kapture</button>
    <button class="tool" data-app="Phone"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>Phone</button>
  </nav>
  <div class="handle" id="handle" role="button" tabindex="0" aria-label="Open all apps"><b></b>All apps</div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead">
    <input class="search" id="search" placeholder="Find an app" aria-label="Find an app" autocomplete="off">
    <button class="close" id="close">Close</button>
  </div>
  <div class="list" id="list"></div>
</aside>
<div class="bgimg" id="bgimg"></div>
<div class="menu" id="menu"><div class="sheet">
  <h3>Background</h3>
  <button class="row" id="pickph">Choose a photo</button>
  <div class="sw" id="sw"></div>
  <button class="row m" id="sharebg">Save photo for lock screen</button>
  <button class="row m" id="resetbg">Reset to default</button>
  <p class="note2">iPhone doesn’t let apps change your lock screen. Save the photo, then set it in Settings → Wallpaper.</p>
</div></div>
<input type="file" accept="image/*" id="bgfile" hidden>
<input type="file" accept="image/*" capture="environment" id="cam" hidden>
<div class="toast" id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)};
var groups={"Make":["Notes","Freeform","Voice Memos","Camera","Music"],"Reference":["Photos","Files","Maps"],"Rest":["Phone","Messages","Mail"]};
function tick(){var d=new Date();$("time").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}).replace(/\s?[AP]M/i,"");$("date").textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})}
tick();setInterval(tick,15000);

var toastT;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},1600)}

try{var s=localStorage.getItem("focus");if(s)$("focus").value=s}catch(e){}
$("focus").addEventListener("input",function(){try{localStorage.setItem("focus",this.value)}catch(e){}});
$("focus").addEventListener("keydown",function(e){if(e.key!=="Enter")return;var q=this.value.trim();this.blur();if(!q||iv)return;var e2=encodeURIComponent(q);location.href="youtube://www.youtube.com/results?search_query="+e2;setTimeout(function(){if(!document.hidden)location.href="https://www.youtube.com/results?search_query="+e2},1200)});

var ART=["art","draw","paint","sketch","illustrat","design","poem","poetry","song","lyric","music","compos","melod","guitar","piano","sing","writ","story","stories","novel","book","script","film","video","photo","edit","animat","craft","sculpt","potter","danc","logo","poster","cover","podcast","record","beat","cartoon","comic","calligraph","knit","sew","carv","color","colour","canvas","mural","fashion"];
function isArt(t){return t.toLowerCase().split(/[^a-z]+/).some(function(w){return w&&ART.some(function(k){return w.indexOf(k)===0})})}
var left=0,iv=null,locked=false;
function fmt(n){return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")}
function todayS(){return new Date().toLocaleDateString("en-CA")}
function idleLabel(){return "Start focus \u00b7 "+(isArt($("creating").value)?30:60)+" min"}
function runLabel(){return fmt(left)+(locked?" \u00b7 locked":"")}
if(fetchS("creatingDay")===todayS())$("creating").value=fetchS("creating")||"";
$("tlabel").textContent=idleLabel();
var autoT=null,lastAuto=$("creating").value;
function startFocus(){
  var v=$("creating").value,art=isArt(v);lastAuto=v;clearTimeout(autoT);
  left=art?1800:3600;locked=!art;
  $("screen").classList.add("running");$("creating").readOnly=true;$("focus").readOnly=true;$("tlabel").textContent=runLabel();
  clearInterval(iv);
  iv=setInterval(function(){left--;$("tlabel").textContent=runLabel();if(left<=0)endSession("Session finished. Take a break.")},1000)
}
function scheduleAuto(){
  clearTimeout(autoT);
  if(iv)return;
  var v=$("creating").value;if(v.trim()===""||v===lastAuto)return;
  autoT=setTimeout(function(){if(!iv&&$("creating").value.trim())startFocus()},isArt(v)?3000:6000);
}
function endSession(msg){clearInterval(iv);iv=null;locked=false;$("screen").classList.remove("running");$("creating").readOnly=false;$("focus").readOnly=false;$("tlabel").textContent=idleLabel();if(msg)toast(msg)}
$("creating").addEventListener("input",function(){store("creating",this.value);store("creatingDay",todayS());if(!iv)$("tlabel").textContent=idleLabel();scheduleAuto()});
$("creating").addEventListener("keydown",function(e){if(e.key==="Enter"){this.blur();if(!iv&&this.value.trim())startFocus()}});
$("timer").addEventListener("click",function(){
  if(iv){if(locked){toast("Locked until the hour ends");return}endSession("Session stopped");return}
  startFocus();
});
scheduleAuto();

function render(q){
  var h="";q=(q||"").toLowerCase();
  for(var g in groups){var items=groups[g].filter(function(a){return a.toLowerCase().indexOf(q)>-1});
    if(items.length){h+="<h2>"+g+"</h2>"+items.map(function(a){return '<button class="app" data-app="'+a+'">'+a+'</button>'}).join("")}}
  $("list").innerHTML=h||'<h2>No app matches. Try a shorter name.</h2>'
}
render();
$("search").addEventListener("input",function(){render(this.value)});

function openD(){$("drawer").classList.add("open");$("drawer").setAttribute("aria-hidden","false")}
function closeD(){$("drawer").classList.remove("open");$("drawer").setAttribute("aria-hidden","true");$("search").value="";render()}
$("handle").addEventListener("click",openD);
$("handle").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" ")openD()});
$("close").addEventListener("click",closeD);
var y0=0;
document.addEventListener("touchstart",function(e){y0=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",function(e){var dy=e.changedTouches[0].clientY-y0;
  if(!$("drawer").classList.contains("open")&&dy<-70&&y0>window.innerHeight*.5&&!iv)openD();
  else if($("drawer").classList.contains("open")&&dy>110&&$("list").scrollTop===0)closeD()},{passive:true});
var urls={"Notes":"mobilenotes://","Freeform":"freeform://","Voice Memos":"voicememos://","Music":"music://","Photos":"photos-redirect://","Files":"shareddocuments://","Maps":"maps://","Phone":"tel:","Messages":"sms:","Mail":"mailto:"};
function go(n){if(n==="Camera"){$("cam").click();return}if(urls[n]){toast("Opening "+n);location.href=urls[n]}}
document.addEventListener("click",function(e){var b=e.target.closest("[data-app]");if(b){go(b.dataset.app);if($("drawer").classList.contains("open"))setTimeout(closeD,250)}});

var SW=[["#16122A",1],["#000000",1],["#1F3A2E",1],["#F4EFE6",0],["#DDE7F0",0]];
var DK={"--ink":"#EDEAF8","--mute":"#9189B0","--line":"#342D55","--surface":"#221C3D"};
var LT={"--ink":"#201A33","--mute":"#6B6483","--line":"#C9C3DB","--surface":"#F3F1F8"};
function store(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);return true}catch(e){return false}}
function fetchS(k){try{return localStorage.getItem(k)}catch(e){return null}}
function applyBg(){
  var r=document.documentElement.style,ph=fetchS("bgphoto"),si=parseInt(fetchS("bgswatch")||"-1",10);
  ["--bg","--ink","--mute","--line","--surface"].forEach(function(k){r.removeProperty(k)});
  document.body.classList.toggle("photo",!!ph);
  $("bgimg").style.display=ph?"block":"none";
  $("bgimg").style.backgroundImage=ph?"url("+ph+")":"none";
  if(!ph&&si>=0){var c=SW[si],t=c[1]?DK:LT;for(var k in t)r.setProperty(k,t[k]);r.setProperty("--bg",c[0])}
}
function openM(){$("menu").classList.add("open")}
function closeM(){$("menu").classList.remove("open")}
SW.forEach(function(c,i){var b=document.createElement("button");b.style.background=c[0];b.setAttribute("aria-label","Colour "+(i+1));b.onclick=function(){store("bgphoto",null);store("bgswatch",String(i));applyBg();closeM()};$("sw").appendChild(b)});
$("resetbg").onclick=function(){store("bgphoto",null);store("bgswatch",null);applyBg();closeM()};
$("menu").onclick=function(e){if(e.target===$("menu"))closeM()};
$("pickph").onclick=function(){$("bgfile").click()};
$("bgfile").onchange=function(){
  var f=this.files[0];if(!f)return;var img=new Image(),u=URL.createObjectURL(f);
  img.onload=function(){var s=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    if(store("bgphoto",c.toDataURL("image/jpeg",.8))){store("bgswatch","-1")}else{toast("Photo too large to save")}
    URL.revokeObjectURL(u);applyBg();closeM()};
  img.src=u;this.value=""};
function toFile(d){var p=d.split(","),bin=atob(p[1]),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new File([a],"kauncher-wallpaper.jpg",{type:"image/jpeg"})}
$("sharebg").onclick=function(){
  var d=fetchS("bgphoto");if(!d){toast("Choose a photo first");return}
  var f=toFile(d);
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){})}else{toast("Saving isn’t supported here")}};
var lp;
$("screen").addEventListener("touchstart",function(e){if(e.target.closest("input,button")||$("screen").classList.contains("running"))return;lp=setTimeout(openM,600)},{passive:true});
["touchend","touchmove","touchcancel"].forEach(function(n){document.addEventListener(n,function(){clearTimeout(lp)},{passive:true})});
applyBg();
</script>
</body>
</html>
