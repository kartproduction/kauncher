<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kotepad: a simple notepad</title>
<meta name="description" content="Kotepad is a calm, simple notepad. Write anything and it is saved on your device.">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#E4E0EE;--ink:#201A33;--mute:#6B6483;--accent:#4A35FF;--surface:#F3F1F8;--line:#C9C3DB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16122A;--ink:#EDEAF8;--mute:#9189B0;--accent:#9C8CFF;--surface:#221C3D;--line:#342D55}}
:root[data-theme="dark"]{--bg:#16122A;--ink:#EDEAF8;--mute:#9189B0;--accent:#9C8CFF;--surface:#221C3D;--line:#342D55}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:28px 20px 40px;min-height:100%;display:flex;flex-direction:column;gap:14px}
h1{font-weight:300;font-size:clamp(40px,11vw,60px);letter-spacing:-.04em;line-height:1}
.sub{color:var(--mute);font-size:15px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,.btn{font:inherit;font-size:15px;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:9px 18px;cursor:pointer}
button.main{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{flex:1;min-width:140px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:0;border-radius:999px;padding:10px 18px}
#list{display:flex;flex-direction:column;gap:10px}
.note{text-align:left;width:100%;background:var(--surface);border:0;border-radius:18px;padding:14px 18px;display:block}
.note b{display:block;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note span{display:block;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note small{color:var(--mute);font-size:12px}
.empty{color:var(--mute);text-align:center;padding:36px 0}
#ed{flex:1;display:flex;flex-direction:column;gap:12px}
textarea{flex:1;min-height:55vh;width:100%;resize:none;font:inherit;font-size:18px;line-height:1.6;color:var(--ink);background:var(--surface);border:0;border-radius:22px;padding:20px}
#st{color:var(--mute);font-size:13px;margin-left:auto}
.foot{color:var(--mute);font-size:13px;margin-top:auto;padding-top:18px}
a{color:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Kotepad</h1>
  <p class="sub">A calm place to write. Your notes are saved on this device.</p>

  <section id="home" style="display:flex;flex-direction:column;gap:14px">
    <div class="bar">
      <button class="main" id="new">New note</button>
      <input type="search" id="q" placeholder="Search notes" aria-label="Search notes">
    </div>
    <div id="list"></div>
    <div class="bar">
      <button id="exp">Back up all notes</button>
      <button id="imp">Restore a backup</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
    <p class="foot">Notes live in this browser on this device. They are not uploaded anywhere. If you clear your browser data they are lost, so use “Back up all notes” now and then.</p>
  </section>

  <section id="ed" hidden>
    <div class="bar">
      <button id="back">← All notes</button>
      <button id="txt">Download .txt</button>
      <button id="del">Delete</button>
      <span id="st"></span>
    </div>
    <textarea id="t" placeholder="Start writing…" aria-label="Note"></textarea>
  </section>

  <p class="foot"><a href="index.html">← Kauncher</a> · © 2026 Kart Production. All rights reserved.</p>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var KEY="kotepad.notes.v1",notes=[],cur=null,timer=null;
function load(){try{notes=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){notes=[]}if(!Array.isArray(notes))notes=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes));$("st").textContent="Saved"}catch(e){$("st").textContent="Could not save (storage is full or blocked)"}}
function title(n){var l=(n.text||"").split("\n").filter(function(x){return x.trim()})[0];return l?l.trim().slice(0,60):"Untitled"}
function snippet(n){var l=(n.text||"").split("\n").filter(function(x){return x.trim()});return l.length>1?l.slice(1).join(" ").slice(0,90):""}
function when(t){var d=new Date(t);return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}
function render(){var q=$("q").value.trim().toLowerCase(),L=$("list");L.textContent="";
 var shown=notes.filter(function(n){return!q||(n.text||"").toLowerCase().indexOf(q)>=0}).sort(function(a,b){return b.t-a.t});
 if(!shown.length){var e=document.createElement("p");e.className="empty";e.textContent=q?"No notes match your search.":"No notes yet. Tap “New note” to start.";L.appendChild(e);return}
 shown.forEach(function(n){var b=document.createElement("button");b.className="note";
  var h=document.createElement("b");h.textContent=title(n);var s=document.createElement("span");s.textContent=snippet(n);var m=document.createElement("small");m.textContent=when(n.t);
  b.appendChild(h);if(snippet(n))b.appendChild(s);b.appendChild(m);b.onclick=function(){open(n.id)};L.appendChild(b)})}
function find(id){return notes.filter(function(n){return n.id===id})[0]}
function open(id){cur=find(id);if(!cur)return;$("t").value=cur.text;$("st").textContent="";$("home").hidden=true;$("ed").hidden=false;$("t").focus()}
function close(){clearTimeout(timer);if(cur&&!cur.text.trim()){notes=notes.filter(function(n){return n!==cur});save()}cur=null;$("ed").hidden=true;$("home").hidden=false;render()}
$("new").onclick=function(){var n={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:"",t:Date.now()};notes.push(n);open(n.id)};
$("t").oninput=function(){if(!cur)return;cur.text=$("t").value;cur.t=Date.now();$("st").textContent="Saving…";clearTimeout(timer);timer=setTimeout(save,400)};
$("back").onclick=function(){clearTimeout(timer);save();close()};
$("del").onclick=function(){if(cur&&confirm("Delete this note? This cannot be undone.")){notes=notes.filter(function(n){return n!==cur});save();cur=null;close()}};
$("q").oninput=render;
function download(name,data,type){var a=document.createElement("a"),u=URL.createObjectURL(new Blob([data],{type:type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
$("txt").onclick=function(){if(!cur)return;download((title(cur).replace(/[^\w\- ]+/g,"").trim()||"note")+".txt",cur.text,"text/plain")};
$("exp").onclick=function(){if(!notes.length){alert("There are no notes to back up yet.");return}download("kotepad-backup.json",JSON.stringify({app:"Kotepad",notes:notes}),"application/json")};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var d=JSON.parse(r.result),add=0;(d.notes||[]).forEach(function(n){if(n&&typeof n.text==="string"&&n.id&&!find(n.id)){notes.push({id:String(n.id),text:n.text,t:+n.t||Date.now()});add++}});save();render();alert(add+" note(s) restored.")}catch(e){alert("That file isn’t a Kotepad backup.")}};
 r.readAsText(f);this.value=""};
load();render();
</script>
</body>
</html>
