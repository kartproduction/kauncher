<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic-Tac-Toe · Kauncher</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#E4E0EE;--ink:#201A33;--mute:#6B6483;--line:#C9C3DB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#16122A;--ink:#EDEAF8;--mute:#9189B0;--line:#342D55}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px;gap:14px}
h1{font-weight:300;font-size:32px;letter-spacing:-.03em}
#st{min-height:1.5em;text-align:center;font-size:18px}
#bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(88vw,300px)}
.c{aspect-ratio:1;border:1.5px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:300;color:var(--ink);background:none;cursor:pointer}
.c i{font-style:normal;font-size:18px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
input{font:inherit;font-size:18px;color:var(--ink);background:none;border:0;border-bottom:1.5px solid var(--line);padding:8px 2px;width:min(80vw,260px);outline:none}
button.p{font:inherit;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:9px 18px;cursor:pointer}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
a{color:var(--mute);font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Tic-Tac-Toe</h1>
<div id="setup" class="row" style="flex-direction:column;align-items:center;gap:12px">
  <div class="row"><button class="p" id="m0">2 players</button><button class="p" id="m1">vs Computer</button></div>
  <div class="row" id="lv"><button class="p" id="e0">Easy</button><button class="p" id="e1">Hard</button></div>
  <input id="n1" maxlength="16" placeholder="Player one name (X)">
  <input id="n2" maxlength="16" placeholder="Player two name (O)">
  <button class="p on" id="go">Start</button>
</div>
<div id="game" hidden>
  <div id="st"></div>
  <div id="bd" style="margin:14px auto"></div>
  <div class="row"><button class="p on" id="again" hidden>Play again</button><button class="p" id="mode">Mode</button></div>
</div>
<a href="index.html">← Kauncher</a>
<script>
var $=function(i){return document.getElementById(i)};
var W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var B,cur,res,mode=0,hard=1,busy=0,names=["",""],M=["X","O"];
function win(m){return W.some(function(w){return w.every(function(i){return B[i]===m})})}
function free(){return B.map(function(v,i){return v?-1:i}).filter(function(i){return i>=0})}
function fin(m,f){return f.filter(function(i){return W.some(function(w){return w.indexOf(i)>=0&&w.every(function(j){return j===i||B[j]===m})})})[0]}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function cpu(){var f=free(),x;if(!hard)return pick(f);
 x=fin("O",f);if(x!==undefined)return x;x=fin("X",f);if(x!==undefined)return x;
 if(f.indexOf(4)>=0)return 4;var c=f.filter(function(i){return i%2===0});return c.length?pick(c):pick(f)}
function draw(){var h="";for(var i=0;i<9;i++)h+='<button class="c" data-i="'+i+'">'+(B[i]||"<i>"+(i+1)+"</i>")+"</button>";
 $("bd").innerHTML=h;
 $("st").textContent=res||names[cur]+" ["+M[cur]+"], your move";
 $("again").hidden=!res}
function play(i){if(res||B[i])return;B[i]=M[cur];busy=0;
 if(win(M[cur]))res=(mode&&cur===1)?"Computer wins! Better luck next time.":"Congratulations, "+names[cur]+" wins!";
 else if(!free().length)res="It's a draw!";
 else{cur=1-cur;if(mode&&cur===1){busy=1;setTimeout(function(){play(cpu())},500)}}
 draw()}
function start(){names=[$("n1").value.trim()||(mode?"Player":"Player 1"),mode?"Computer":($("n2").value.trim()||"Player 2")];
 B=Array(9).fill("");cur=0;res="";busy=0;$("setup").hidden=true;$("game").hidden=false;draw()}
function ui(){$("m0").className="p"+(mode?"":" on");$("m1").className="p"+(mode?" on":"");$("lv").hidden=!mode;$("n2").hidden=!!mode;
 $("n1").placeholder=mode?"Your name (X)":"Player one name (X)";$("e0").className="p"+(hard?"":" on");$("e1").className="p"+(hard?" on":"")}
$("bd").onclick=function(e){var b=e.target.closest(".c");if(!b||busy)return;if(mode&&cur===1)return;play(+b.dataset.i)};
$("m0").onclick=function(){mode=0;ui()};$("m1").onclick=function(){mode=1;ui()};
$("e0").onclick=function(){hard=0;ui()};$("e1").onclick=function(){hard=1;ui()};
$("go").onclick=start;$("again").onclick=start;
$("mode").onclick=function(){$("game").hidden=true;$("setup").hidden=false};
ui();
</script>
</body>
</html>
