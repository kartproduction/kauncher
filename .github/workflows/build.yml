name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project
        run: unzip -q Kauncher.zip
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Signing secrets are missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kauncher.jks"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kauncher.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd Kauncher && gradle assembleDebug --no-daemon --console=plain
      - name: Show signing fingerprint
        continue-on-error: true
        run: $ANDROID_HOME/build-tools/*/apksigner verify --print-certs Kauncher/app/build/outputs/apk/debug/app-debug.apk        run: keytool -printcert -jarfile Kauncher/app/build/outputs/apk/debug/app-debug.apk | grep SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: kauncher-apk
          path: Kauncher/app/build/outputs/apk/debug/app-debug.apk
