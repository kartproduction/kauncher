name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, for example v2.8 (leave empty to only build)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project
        run: unzip -q Kauncher.zip
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Signing secrets are missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kauncher.jks"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kauncher.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd Kauncher && gradle assembleRelease --no-daemon --console=plain
      - name: Name and check the APK
        run: |
          cp Kauncher/app/build/outputs/apk/release/app-release.apk Kauncher.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -x "$BT/aapt2" ] && "$BT/aapt2" dump badging Kauncher.apk | grep -q "application-debuggable"; then
            echo "ERROR: this APK is still a debug build."; exit 1
          fi
          [ -x "$BT/apksigner" ] && "$BT/apksigner" verify --print-certs Kauncher.apk | head -3 || true
      - uses: actions/upload-artifact@v4
        with:
          name: kauncher-apk
          path: Kauncher.apk

      # Publishing: runs only when you push a tag like v2.8, or type a version into "Run workflow".
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' Kauncher/app/build.gradle.kts)
          if [ "$TAG" != "v$NAME" ]; then
            echo "Tag $TAG does not match the app version v$NAME. Change versionName in the app, or use tag v$NAME."
            exit 1
          fi
          gh release create "$TAG" Kauncher.apk \
            --target "$GITHUB_SHA" --title "Kauncher $NAME" --generate-notes --latest
