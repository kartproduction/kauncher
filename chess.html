<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess · Kauncher</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#E4E0EE;--ink:#201A33;--mute:#6B6483;--line:#C9C3DB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#16122A;--ink:#EDEAF8;--mute:#9189B0;--line:#342D55}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px;gap:14px}
h1{font-weight:300;font-size:32px;letter-spacing:-.03em}
#st{color:var(--mute);min-height:1.5em;text-align:center}
#bd{display:grid;grid-template-columns:repeat(8,1fr);width:min(92vw,440px);aspect-ratio:1;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
.s{display:flex;align-items:center;justify-content:center;font-size:min(9vw,44px);position:relative;user-select:none;cursor:pointer;line-height:1}
.l{background:#CFC8E6}.d{background:#8F84BD}
.s.sel{background:#7b6cff}.s.lm{box-shadow:inset 0 0 0 100px rgba(255,216,74,.4)}.s.ck{box-shadow:inset 0 0 0 100px rgba(255,64,64,.55)}
.s.t::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(32,26,51,.35);position:absolute}
.w{color:#fff;text-shadow:0 0 2px #000,0 0 3px #000}.b{color:#1a1530}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:9px 18px;cursor:pointer}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
a{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<h1>Chess</h1>
<div class="row"><button id="m0">2 players</button><button id="m1">vs Computer</button></div>
<div class="row" id="lv"><button id="e0">Easy</button><button id="e1">Hard</button></div>
<div id="st"></div>
<div id="bd"></div>
<div class="row"><button id="ng">New game</button></div>
<a href="index.html">← Kauncher</a>
<script>
var $=function(i){return document.getElementById(i)};
var isW=function(p){return p&&p===p.toUpperCase()};
var R4=[[1,0],[-1,0],[0,1],[0,-1]],B4=[[1,1],[1,-1],[-1,1],[-1,-1]],N8=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],A8=R4.concat(B4);
var GL={k:"\u265A",q:"\u265B",r:"\u265C",b:"\u265D",n:"\u265E",p:"\u265F"};
function init(){return{b:"rnbqkbnrpppppppp".split("").concat(Array(32).fill(""),"PPPPPPPPRNBQKBNR".split("")),t:"w",c:"KQkq",e:-1}}
function ok(r,c){return r>=0&&r<8&&c>=0&&c<8}
function att(b,s,w){var r=s>>3,c=s&7,P=w?"PNBRQK":"pnbrqk",pr=w?r+1:r-1,i,k,q,rr,cc,rk;
 if((ok(pr,c-1)&&b[pr*8+c-1]===P[0])||(ok(pr,c+1)&&b[pr*8+c+1]===P[0]))return true;
 for(i=0;i<8;i++){rr=r+N8[i][0];cc=c+N8[i][1];if(ok(rr,cc)&&b[rr*8+cc]===P[1])return true;rr=r+A8[i][0];cc=c+A8[i][1];if(ok(rr,cc)&&b[rr*8+cc]===P[5])return true}
 for(i=0;i<8;i++){rk=i<4;rr=r+A8[i][0];cc=c+A8[i][1];
  while(ok(rr,cc)){q=b[rr*8+cc];if(q){if(q===P[4]||q===(rk?P[3]:P[2]))return true;break}rr+=A8[i][0];cc+=A8[i][1]}}
 return false}
function gen(S){var b=S.b,w=S.t==="w",m=[],s,p,r,f,u,i,d,base;
 for(s=0;s<64;s++){p=b[s];if(!p||isW(p)!==w)continue;r=s>>3;f=s&7;u=p.toUpperCase();
  var add=function(rr,ff){if(!ok(rr,ff))return false;var q=b[rr*8+ff];if(q&&isW(q)===w)return false;m.push({f:s,t:rr*8+ff});return!q};
  if(u==="P"){d=w?-1:1;
   if(!b[(r+d)*8+f]){m.push({f:s,t:(r+d)*8+f});if(r===(w?6:1)&&!b[(r+2*d)*8+f])m.push({f:s,t:(r+2*d)*8+f})}
   [-1,1].forEach(function(dc){var f2=f+dc;if(f2<0||f2>7)return;var t=(r+d)*8+f2,q=b[t];if(q&&isW(q)!==w)m.push({f:s,t:t});else if(t===S.e)m.push({f:s,t:t,ep:1})})}
  else if(u==="N")N8.forEach(function(v){add(r+v[0],f+v[1])});
  else if(u==="K"){A8.forEach(function(v){add(r+v[0],f+v[1])});base=w?60:4;
   if(s===base&&!att(b,s,!w)){
    if(S.c.indexOf(w?"K":"k")>=0&&!b[base+1]&&!b[base+2]&&!att(b,base+1,!w)&&!att(b,base+2,!w))m.push({f:s,t:base+2,cs:1});
    if(S.c.indexOf(w?"Q":"q")>=0&&!b[base-1]&&!b[base-2]&&!b[base-3]&&!att(b,base-1,!w)&&!att(b,base-2,!w))m.push({f:s,t:base-2,cs:1})}}
  else{var ds=u==="R"?R4:u==="B"?B4:A8;ds.forEach(function(v){var rr=r+v[0],ff=f+v[1];while(add(rr,ff)){rr+=v[0];ff+=v[1]}})}}
 return m}
function make(S,mv){var b=S.b.slice(),p=b[mv.f],c=S.c,e=-1;b[mv.t]=p;b[mv.f]="";
 if(mv.ep)b[mv.t+(isW(p)?8:-8)]="";
 if(p==="P"&&mv.t<8)b[mv.t]="Q";if(p==="p"&&mv.t>55)b[mv.t]="q";
 if(mv.cs){if(mv.t>mv.f){b[mv.t-1]=b[mv.f+3];b[mv.f+3]=""}else{b[mv.t+1]=b[mv.f-4];b[mv.f-4]=""}}
 if(p.toUpperCase()==="P"&&Math.abs(mv.t-mv.f)===16)e=(mv.f+mv.t)/2;
 [mv.f,mv.t].forEach(function(s){if(s===60)c=c.replace(/[KQ]/g,"");if(s===4)c=c.replace(/[kq]/g,"");if(s===63)c=c.replace("K","");if(s===56)c=c.replace("Q","");if(s===7)c=c.replace("k","");if(s===0)c=c.replace("q","")});
 return{b:b,t:S.t==="w"?"b":"w",c:c,e:e}}
function chk(S){return att(S.b,S.b.indexOf(S.t==="w"?"K":"k"),S.t==="b")}
function legal(S){return gen(S).filter(function(mv){var n=make(S,mv);return!att(n.b,n.b.indexOf(S.t==="w"?"K":"k"),S.t==="b")})}
var V={p:100,n:320,b:330,r:500,q:900,k:0};
function ev(S){var x=0,s,p,k;for(s=0;s<64;s++){p=S.b[s];if(!p)continue;k=p.toLowerCase();x+=(isW(p)?1:-1)*(V[k]+(k==="k"?0:(6-Math.abs(3.5-(s>>3))-Math.abs(3.5-(s&7)))*3))}return x}
function nm(S,d,a,b){var ms=legal(S),i,v;if(!ms.length)return chk(S)?-99999-d:0;if(!d)return(S.t==="w"?1:-1)*ev(S);
 for(i=0;i<ms.length;i++){v=-nm(make(S,ms[i]),d-1,-b,-a);if(v>=b)return b;if(v>a)a=v}return a}
function best(S,hard){var ms=legal(S).sort(function(){return Math.random()-.5}),caps=ms.filter(function(m){return S.b[m.t]});
 if(!hard)return caps.length&&Math.random()<.5?caps[0]:ms[0];
 var bm=ms[0],bv=-1e9,i,v;for(i=0;i<ms.length;i++){v=-nm(make(S,ms[i]),2,-1e9,1e9);if(v>bv){bv=v;bm=ms[i]}}return bm}

var S,sel=-1,last=null,mode=0,hard=1,over=0,busy=0,moves=[];
function draw(){moves=legal(S);over=!moves.length;var ck=chk(S),w=S.t==="w",kp=S.b.indexOf(w?"K":"k"),h="",s,p,cl;
 for(s=0;s<64;s++){p=S.b[s];cl="s "+((s>>3)+(s&7)&1?"d":"l");
  if(last&&(s===last.f||s===last.t))cl+=" lm";if(s===sel)cl+=" sel";if(ck&&s===kp)cl+=" ck";
  if(sel>=0&&moves.some(function(m){return m.f===sel&&m.t===s}))cl+=" t";
  h+='<div class="'+cl+'" data-s="'+s+'">'+(p?'<span class="'+(isW(p)?"w":"b")+'">'+GL[p.toLowerCase()]+"\uFE0E</span>":"")+"</div>"}
 $("bd").innerHTML=h;
 $("st").textContent=over?(ck?"Checkmate — "+(w?"Black":"White")+" wins":"Stalemate — draw"):(w?"White":"Black")+" to move"+(ck?" (check!)":"");
 $("m0").className=mode?"":"on";$("m1").className=mode?"on":"";$("lv").style.display=mode?"":"none";$("e0").className=hard?"":"on";$("e1").className=hard?"on":""}
function play(mv){busy=0;S=make(S,mv);last=mv;sel=-1;draw();
 if(mode&&!over&&S.t==="b"){busy=1;setTimeout(function(){play(best(S,hard))},350)}}
function newGame(){busy=0;S=init();sel=-1;last=null;draw()}
$("bd").onclick=function(e){var el=e.target.closest(".s");if(!el||busy||over)return;var s=+el.dataset.s,p=S.b[s],mv;
 if(sel>=0){mv=moves.filter(function(m){return m.f===sel&&m.t===s})[0];if(mv){play(mv);return}}
 sel=(p&&isW(p)===(S.t==="w")&&!(mode&&S.t==="b"))?s:-1;draw()};
$("m0").onclick=function(){mode=0;newGame()};$("m1").onclick=function(){mode=1;newGame()};
$("e0").onclick=function(){hard=0;newGame()};$("e1").onclick=function(){hard=1;newGame()};$("ng").onclick=newGame;
newGame();
</script>
</body>
</html>
