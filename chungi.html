<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chungi · Kauncher</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#E4E0EE;--ink:#201A33;--mute:#6B6483;--line:#C9C3DB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#16122A;--ink:#EDEAF8;--mute:#9189B0;--line:#342D55}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px 14px 10px;gap:8px;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1{font-weight:300;font-size:32px;letter-spacing:-.03em}
.sub{color:var(--mute);font-size:14px;min-height:1.3em;text-align:center}
#wrap{flex:1;width:min(100%,460px);min-height:0;position:relative}
canvas{width:100%;height:100%;display:block;border:1.5px solid var(--line);border-radius:20px;touch-action:none}
a{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<h1>Chungi</h1>
<p class="sub" id="sc"></p>
<div id="wrap"><canvas id="cv" aria-label="Chungi game. Tap to kick the ball."></canvas></div>
<a href="kames.html" id="back">← Kames</a>
<script>
var $=function(i){return document.getElementById(i)};
var BK="kames.chungi.best.v1";
function getBest(){try{return +localStorage.getItem(BK)||0}catch(e){return 0}}
function setBest(n){try{localStorage.setItem(BK,n)}catch(e){}}
var cv=$("cv"),cx=cv.getContext("2d"),W,H,D,best=getBest();
var ball,score,state="ready",overAt=0,tap=null,pops=[],last=0;
var COL=["#E8553D","#F2B134","#3DA5D9","#6BBF59","#C65BCF"];
var dark=matchMedia("(prefers-color-scheme:dark)");
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function fit(){D=Math.min(devicePixelRatio||1,2);var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}
function reset(){ball={x:W/2,y:H*.18,vx:0,vy:0,r:Math.min(W,H)*.07,a:0,w:0};score=0;pops=[];tap=null}
function info(){$("sc").textContent=best?"Best: "+best+" kicks":"Keep it in the air. Tap to kick."}
var G=function(){return H*1.9};
function kick(px){
  var b=ball,zone=H*.42;
  if(b.y<zone)return;               // ball too high to reach
  var off=(b.x-px)/W;               // tap left of ball pushes it right
  b.vy=-Math.sqrt(2*G()*H*(.36+Math.random()*.05));
  b.vx=b.vx*.25+off*W*3.2;
  b.vx=Math.max(-W*.9,Math.min(W*.9,b.vx));
  b.w=(Math.random()-.5)*14;
  score++;tap={x:px,t:0};
  pops.push({x:b.x,y:b.y+b.r,t:0,n:score});
  if(navigator.vibrate)navigator.vibrate(12);
}
function end(){state="over";overAt=performance.now();
  if(score>best){best=score;setBest(best)}info()}
function step(dt){
  var b=ball;
  if(state==="play"){
    b.vy+=G()*dt;
    b.vx*=1-.35*dt;                 // air drag on the light ball
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;b.w*=1-.8*dt;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.6}
    if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.6}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.4}
    if(b.y>H*.9-b.r){b.y=H*.9-b.r;end()}
  }else if(state==="ready"){
    b.y=H*.18+Math.sin(performance.now()/500)*6;b.a=Math.sin(performance.now()/700)*.3
  }
  pops.forEach(function(p){p.t+=dt});pops=pops.filter(function(p){return p.t<.6});
  if(tap){tap.t+=dt;if(tap.t>.25)tap=null}
}
function chungi(x,y,r,a,lean){
  cx.save();cx.translate(x,y);cx.rotate(a);
  // bands fan out from the tied middle
  for(var i=0;i<14;i++){
    var t=i/14*Math.PI*2+lean*.02,len=r*(.85+.15*Math.sin(i*2.3)),c=COL[i%5];
    cx.strokeStyle=c;cx.lineWidth=r*.16;cx.lineCap="round";
    cx.beginPath();cx.moveTo(0,0);
    cx.quadraticCurveTo(Math.cos(t+.5)*len*.9,Math.sin(t+.5)*len*.9,Math.cos(t)*len,Math.sin(t)*len);
    cx.stroke();
    cx.beginPath();cx.moveTo(Math.cos(t)*len,Math.sin(t)*len);
    cx.quadraticCurveTo(Math.cos(t-.45)*len*.7,Math.sin(t-.45)*len*.7,0,0);cx.stroke();
  }
  cx.fillStyle=css("--ink");cx.beginPath();cx.arc(0,0,r*.16,0,7);cx.fill();   // the knot
  cx.restore();
}
function draw(){
  var ink=css("--ink"),mute=css("--mute"),line=css("--line"),b=ball;
  cx.clearRect(0,0,W,H);
  // foot zone
  cx.setLineDash([6,8]);cx.strokeStyle=line;cx.lineWidth=1.5;
  cx.beginPath();cx.moveTo(14,H*.42);cx.lineTo(W-14,H*.42);cx.stroke();cx.setLineDash([]);
  // ground
  cx.strokeStyle=mute;cx.beginPath();cx.moveTo(0,H*.9);cx.lineTo(W,H*.9);cx.stroke();
  // shadow
  var sh=Math.max(0,1-(H*.9-b.y)/H);
  cx.fillStyle=line;cx.beginPath();cx.ellipse(b.x,H*.9+6,b.r*(.5+sh*.7),b.r*.18,0,0,7);cx.fill();
  // foot tap ring
  if(tap){cx.strokeStyle=ink;cx.globalAlpha=1-tap.t/.25;cx.lineWidth=2;
    cx.beginPath();cx.arc(tap.x,Math.max(tap.y||0,H*.8),10+tap.t*120,0,7);cx.stroke();cx.globalAlpha=1}
  chungi(b.x,b.y,b.r,b.a,b.vx/W);
  // score
  cx.fillStyle=ink;cx.textAlign="center";cx.font="300 "+Math.round(H*.12)+"px system-ui,sans-serif";
  cx.fillText(state==="ready"?"":score,W/2,H*.3);
  pops.forEach(function(p){cx.globalAlpha=1-p.t/.6;cx.font="300 "+Math.round(H*.035)+"px system-ui,sans-serif";
    cx.fillText("+1",p.x,p.y+22+p.t*40);cx.globalAlpha=1});
  cx.font="300 "+Math.round(H*.036)+"px system-ui,sans-serif";cx.fillStyle=mute;
  if(state==="ready"){cx.fillText("Tap to drop the chungi",W/2,H*.55);
    cx.fillText("Then tap below the line to kick",W/2,H*.61)}
  if(state==="over"){cx.fillStyle=ink;cx.font="300 "+Math.round(H*.06)+"px system-ui,sans-serif";
    cx.fillText("Dropped at "+score,W/2,H*.5);
    cx.fillStyle=mute;cx.font="300 "+Math.round(H*.036)+"px system-ui,sans-serif";
    cx.fillText(score&&score>=best?"New best!":"Best: "+best,W/2,H*.56);
    cx.fillText("Tap to play again",W/2,H*.62)}
}
function loop(t){var dt=Math.min((t-last)/1000||0,.033);last=t;step(dt);draw();requestAnimationFrame(loop)}
function press(e){
  e.preventDefault();
  var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(state==="ready"){state="play";ball.vy=0}
  else if(state==="over"){if(performance.now()-overAt>450){reset();state="ready";info()}}
  else{kick(x);if(tap)tap.y=y}
}
cv.addEventListener("pointerdown",press);
addEventListener("keydown",function(e){if(e.code==="Space"||e.key===" "){press({preventDefault:function(){},clientX:cv.getBoundingClientRect().left+ball.x+(Math.random()-.5)*20,clientY:H})}});
addEventListener("resize",function(){fit();reset();state="ready";info()});
fit();reset();info();requestAnimationFrame(loop);
if(/from=app/.test(location.search)){var bk=$("back");if(bk){bk.href="app.html";bk.textContent="← Home"}}
</script>
</body>
</html>
